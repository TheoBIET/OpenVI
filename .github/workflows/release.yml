name: Release

# A `v*` tag publishes a release: installers for every platform, signed for the updater, and `latest.json`, which
# installed copies of OpenVI read to find a newer version
# (https://github.com/TheoBIET/OpenVI/releases/latest/download/latest.json).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version} " 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo
            echo 'Windows: run the `-setup.exe` (SmartScreen asks to confirm: builds are not code-signed yet). macOS: the'
            echo '`.dmg` (right-click, Open, the first time). Linux: the `.AppImage`, `.deb` or `.rpm`. Installed copies'
            echo 'update themselves: the status bar offers each new version.'
          } >> notes.md
          cat notes.md
          { echo "notes<<NOTES_END"; cat notes.md; echo NOTES_END; } >> "$GITHUB_OUTPUT"
      # A draft until every platform is built: `releases/latest` (and its latest.json) moves only then.
      # The builds upload to it by id: a draft cannot be found by its tag.
      - name: Create it as a draft, or keep the one there
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "OpenVI $GITHUB_REF_NAME" --notes-file notes.md --verify-tag --draft
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, args: --target aarch64-apple-darwin }
          - { name: macOS x64, os: macos-latest, args: --target x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-22.04, args: '' }
          - { name: Windows, os: windows-latest, args: '' }
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the public key is in tauri.conf.json (plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseName: OpenVI ${{ github.ref_name }}
          # Also the notes installed copies show beside "Update to x.y.z" (latest.json).
          releaseBody: ${{ needs.release.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          # Windows updates install the NSIS setup (.exe), not the MSI.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish it, now that every installer and latest.json are there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
