[package]
name = "openvi"
version = "0.1.0"
description = "OpenVI desktop app"
authors = ["Théo BIET"]
license = "GPL-3.0-only"
repository = "https://github.com/TheoBIET/OpenVI"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "openvi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# Canonical paths without the `\\?\` prefix on Windows.
dunce = "1"
