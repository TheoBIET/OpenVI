[package]
name = "openvi-formats"
version = "0.17.0"
description = "OpenVI's formats adapter: the only caller of sixng-core"
authors = ["Théo BIET"]
license = "GPL-3.0-only"
repository = "https://github.com/TheoBIET/OpenVI"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# Pinned to one commit: SixNG changes several times an hour. `default-features = false` drops libopus (and CMake).
sixng-core = { git = "https://github.com/holdmysocks/SixNG", rev = "e46a7f81053ced73e253cb693bde383efe86aa3f", default-features = false }
flate2 = { version = "1", optional = true }
# PNG previews of decoded textures (the version and features sixng-core uses).
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# Synthetic archives for the tests of crates that use this one.
fixtures = ["dep:flate2"]

[dev-dependencies]
flate2 = "1"
